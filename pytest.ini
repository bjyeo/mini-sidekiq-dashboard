[pytest]
# Test discovery
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html

# Markers
markers =
    integration: Integration tests that require external services (Supabase)
    unit: Unit tests with no external dependencies
    slow: Tests that take a long time to run

# Warnings
filterwarnings =
    ignore::DeprecationWarning:supabase._sync.client